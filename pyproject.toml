[project]
name = "filmlook"
version = "0.1.0"
description = "Film looks for RAW photos: preview, tweak, export full-resolution JPG."
requires-python = ">=3.10"
dependencies = [
  "rawpy>=0.21",
  "numpy>=1.24",
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Library search: local image-text model on the M1 GPU
search = ["torch>=2.2", "open_clip_torch>=2.24", "transformers>=4.40", "sentencepiece>=0.2", "scikit-learn>=1.3",
          "pyobjc-framework-Vision>=10; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'"]

[project.scripts]
filmlook = "filmlook.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["filmlook"]

[tool.setuptools.package-data]
filmlook = ["static/*"]
